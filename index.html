
<!DOCTYPE html>

        href="https://fonts.gstatic.com"
        crossorigin>

    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->

<body>

  <div class="app">

    <!-- ===================================
         왼쪽 사이드바
    =================================== -->

    <aside class="sidebar" id="sidebar">

      <!-- 상단 땡땡이 무늬 -->
      <div class="sidebar-check sidebar-check-top"
           aria-hidden="true"></div>

            <svg class="folder-terminal-icon"
                 viewBox="0 0 64 56"
                 xmlns="http://www.w3.org/2000/svg"
                 role="img"
                 aria-label="터미널 폴더 아이콘">

              <!-- 폴더 외곽 -->
              <path
                d="M6 16 V12 Q6 8 10 8 H25

                fill="none"
                stroke="currentColor"
                stroke-width="2.5"

                d="M7 21 H57"
                fill="none"
                stroke="currentColor"
                stroke-width="2"

                stroke-width="2.8"
                stroke-linecap="round"

              />

              <path
                d="M31 41 H43"
                fill="none"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
              />

            </svg>
          </div>

          <h1>Security<br>Note</h1>

          <p>
            Development · Security · Study

        <!-- 메인 메뉴 -->
        <nav class="main-nav"

          <button

            ⌂ <span>Home</span>
          </button>

            type="button"
            data-page="about"
            class="nav-btn">
            ♙ <span>About</span>
          </button>

          <button
            type="button"
            data-page="archives"
            class="nav-btn">
            ▤ <span>Archives</span>
          </button>

          <button
            type="button"
            data-page="tags"
            class="nav-btn">
            ◇ <span>Tags</span>
          </button>

        </nav>

        <!-- 구분선 -->
        <div class="side-divider"></div>

        <!-- 카테고리 -->
        <div class="category-menu">

          <h2>▱ &nbsp; Categories</h2>

          <button
            type="button"
            class="category-btn"
            data-category="개발">
            ▱ &nbsp; 개발
          </button>

          <button
            type="button"
            class="category-btn"
            data-category="CTF/Wargame">
            ▱ &nbsp; CTF / Wargame
          </button>

          <button
            type="button"
            class="category-btn"
            data-category="Bug Bounty">
            ▱ &nbsp; Bug Bounty
          </button>

          <button
            type="button"
            class="category-btn"
            data-category="블로그/기술문서">

            type="button"
            class="category-btn"
            data-category="공모전/자격증">
            ▱ &nbsp; 공모전 / 자격증
          </button>

        </div>

        <!-- 하단 정보 -->
        <div class="side-divider"></div>

        <div class="side-footer">
          <small>© 2026 ooxxd</small>

    =================================== -->

    <main class="main">

      <!-- 상단 검색 및 메뉴 -->
      <header class="topbar">

        <!-- 모바일 메뉴 -->
        <button
          type="button"
          class="mobile-menu"
          id="menu-toggle"
          aria-label="메뉴 열기">
          ☰
        </button>

        <!-- 검색 -->
        <div class="search-wrap">

          <span aria-hidden="true">⌕</span>

          <input
            type="search"
            id="search"
            placeholder="글 검색하기..."
            aria-label="게시글 검색"
          >

        </div>

        <!-- GitHub -->
        <a
          id="github-link"
          href="https://github.com/ooxxd"
          target="_blank"
          rel="noopener noreferrer">
          GitHub ↗
        </a>

        <!-- 테마 변경 -->
        <button
          type="button"
          id="theme-toggle"
          class="icon-button"
          aria-label="테마 변경">
          ☾
        </button>

      </header>


      <!-- 실제 화면이 표시되는 영역 -->
      <!-- Home, About, Archives, Tags, 카테고리 -->
      <div id="page-content"
           aria-live="polite">

        <!-- script.js가 내용을 자동으로 표시 -->

      </div>

          <span>✿ profile.exe</span>
          <span>─ □ ×</span>
        </div>

        <div class="widget-content">

          <div class="profile-row">

            <!-- 프로필 사진: GitHub에서 변경 -->
            <div class="profile-photo">

              <img
                id="profile-img"
                src="./assets/profile.png"
                alt="ooxxd 프로필 사진"
              >

              <span
                id="profile-placeholder"
                hidden>
                o

            <!-- 프로필 소개 -->

            <button
              type="button"
              data-page="about"
              class="text-link">
              About me ↗
            </button>

            <a
              href="https://github.com/ooxxd"
              target="_blank"
              rel="noopener noreferrer">
              GitHub ↗
            </a>

        learning, breaking & documenting_
